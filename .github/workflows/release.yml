name: Release

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            published: ${{ steps.release.outputs.published }}
            version: ${{ steps.release.outputs.version }}
            tag: ${{ steps.release.outputs.tag }}
            revision: ${{ steps.release.outputs.revision }}
        env:
            HUSKY: '0'
        steps:
            - name: Check out main with release history
              uses: actions/checkout@v7
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  package-manager-cache: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.2'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check types
              run: bun run check

            - name: Run tests
              run: bun run test

            - name: Build
              run: bun run build

            - name: Release
              id: release
              run: node scripts/release.mjs
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-image:
        needs: release
        if: needs.release.outputs.published == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out the release commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release.outputs.tag }}
                  persist-credentials: false

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
              with:
                  platforms: arm64

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate image tags and labels
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
                      type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
                  labels: |
                      org.opencontainers.image.revision=${{ needs.release.outputs.revision }}

            - name: Build and push the release image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
