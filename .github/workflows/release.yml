name: Release

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            published: ${{ steps.release.outputs.published }}
            version: ${{ steps.release.outputs.version }}
            tag: ${{ steps.release.outputs.tag }}
            revision: ${{ steps.release.outputs.revision }}
        env:
            HUSKY: '0'
        steps:
            - name: Check out main with release history
              uses: actions/checkout@v7
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  package-manager-cache: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.3'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check types
              run: bun run check

            - name: Run tests
              run: bun run test

            - name: Build
              run: bun run build

            - name: Release
              id: release
              run: node scripts/release.mjs
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-packages:
        needs: release
        if: needs.release.outputs.published == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            HUSKY: '0'
        steps:
            - name: Check out the release commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release.outputs.tag }}
                  persist-credentials: false

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

            - name: Set up Node.js for GitHub Packages
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
                  registry-url: https://npm.pkg.github.com
                  scope: '@madkarmaa'

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.3'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # The server package includes the built web app.
            - name: Build workspaces
              run: bun run build

            - name: Publish core, server, and cli
              run: npm publish --workspace core --workspace server --workspace cli
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-executables:
        needs: release
        if: needs.release.outputs.published == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            HUSKY: '0'
        steps:
            - name: Check out the release commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release.outputs.tag }}
                  persist-credentials: false

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  package-manager-cache: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.3'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Each executable records its asset name so `phodrive update` downloads the same build.
            - name: Compile executables
              working-directory: cli
              run: |
                  for target in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
                      asset="phodrive-$target"
                      if [[ $target == windows-* ]]; then asset="$asset.exe"; fi

                      bun build src/index.ts --compile --minify \
                          --conditions @madkarmaa/phodrive-core \
                          --target "bun-$target" \
                          --define "PHODRIVE_RELEASE_ASSET=\"$asset\"" \
                          --outfile "build/release/$asset"
                  done
                  chmod +x build/release/*

            - name: Attach executables to the release
              run: gh release upload "$TAG" cli/build/release/* --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.release.outputs.tag }}

    publish-image:
        needs: release
        if: needs.release.outputs.published == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out the release commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release.outputs.tag }}
                  persist-credentials: false

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
              with:
                  platforms: arm64

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate image tags and labels
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
                      type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
                  labels: |
                      org.opencontainers.image.revision=${{ needs.release.outputs.revision }}

            - name: Build and push the release image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
